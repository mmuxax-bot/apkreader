# Köhnə build nəticələrini və qalıq iş branch-lərini təmizləyir (gündə bir dəfə).
name: Cleanup old builds

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TTL_DAYS: "7"
      BRANCH_TTL_HOURS: "6"
    steps:
      - name: Delete expired releases
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "$RELEASE_TTL_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name | startswith(\"job-\")) | select(.created_at < \"$cutoff\") | .tag_name" |
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "release siliniir: $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          done

      - name: Delete stale job branches
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "$BRANCH_TTL_HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/jobs/" --jq '.[].ref' |
          while read -r ref; do
            [ -n "$ref" ] || continue
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/$ref" --jq '.object.sha')
            date=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$sha" --jq '.committer.date')
            if [[ "$date" < "$cutoff" ]]; then
              echo "branch siliniir: $ref"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/$ref" || true
            fi
          done
