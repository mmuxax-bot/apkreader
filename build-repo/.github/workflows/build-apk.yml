# APK Studio — build runner.
# Bu workflow yalnız APK Studio serveri tərəfindən (workflow_dispatch) işə salınır.
# İş faylları `jobs/<job_id>` branch-ində hissə-hissə (part-000, part-001, ...) saxlanılır.
name: Build APK
run-name: "APK build ${{ inputs.job_id }}"

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Unikal iş identifikatoru (uuid)"
        required: true
        type: string
      parts:
        description: "Kit ZIP-inin hissə sayı"
        required: true
        type: string
      sha256:
        description: "Kit ZIP-inin SHA-256 yoxlama cəmi"
        required: true
        type: string
      format:
        description: "apk | aab | both"
        required: false
        default: "apk"
        type: string

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Etibarsız (istifadəçi tərəfindən yaradılan) kod yalnız oxuma icazəsi ilə işləyir.
    permissions:
      contents: read
    env:
      JOB_ID: ${{ inputs.job_id }}
      PARTS: ${{ inputs.parts }}
      KIT_SHA256: ${{ inputs.sha256 }}
      FORMAT: ${{ inputs.format }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$JOB_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "job_id etibarsızdır"; exit 1; }
          [[ "$PARTS" =~ ^[0-9]{1,3}$ ]] && [ "$PARTS" -ge 1 ] && [ "$PARTS" -le 40 ] || { echo "parts etibarsızdır"; exit 1; }
          [[ "$KIT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "sha256 etibarsızdır"; exit 1; }
          [[ "$FORMAT" =~ ^(apk|aab|both)$ ]] || { echo "format etibarsızdır"; exit 1; }

      - name: Checkout job files
        uses: actions/checkout@v4
        with:
          ref: jobs/${{ inputs.job_id }}
          path: job
          persist-credentials: false

      - name: Reassemble kit
        run: |
          set -euo pipefail
          dir="job/jobs/$JOB_ID"
          count=$(ls "$dir" | grep -c '^part-[0-9]\{3\}$' || true)
          [ "$count" -eq "$PARTS" ] || { echo "Hissə sayı uyğun deyil: $count != $PARTS"; exit 1; }
          : > kit.zip
          for i in $(seq 0 $((PARTS - 1))); do
            cat "$dir/$(printf 'part-%03d' "$i")" >> kit.zip
          done
          echo "$KIT_SHA256  kit.zip" | sha256sum -c -
          rm -rf job
          mkdir kit
          unzip -q kit.zip -d kit
          script=$(find kit -maxdepth 6 -path '*/app/scripts/build-android.sh' | head -n 1)
          [ -n "$script" ] || { echo "build-android.sh tapılmadı"; exit 1; }
          echo "KIT_SCRIPT=$script" >> "$GITHUB_ENV"
          echo "KIT_ROOT=$(cd "$(dirname "$script")/../.." && pwd)" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        run: |
          set -eo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null || true
          set -o pipefail
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build Android app
        run: |
          set -euo pipefail
          chmod +x "$KIT_SCRIPT" || true
          bash "$KIT_SCRIPT"
          ls -la "$KIT_ROOT/output"
          compgen -G "$KIT_ROOT/output/*.apk" > /dev/null || compgen -G "$KIT_ROOT/output/*.aab" > /dev/null || { echo "APK/AAB tapılmadı"; exit 1; }

      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ inputs.job_id }}
          path: |
            ${{ env.KIT_ROOT }}/output/*.apk
            ${{ env.KIT_ROOT }}/output/*.aab
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - name: Download build result
        uses: actions/download-artifact@v4
        with:
          name: result-${{ inputs.job_id }}
          path: result

      - name: Publish release
        run: |
          set -euo pipefail
          ls -la result
          gh release create "job-$JOB_ID" result/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "APK build $JOB_ID" \
            --notes "APK Studio build $JOB_ID"

  cleanup:
    name: Cleanup
    needs: [build, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - name: Delete job files
        run: |
          [[ "$JOB_ID" =~ ^[0-9a-f-]{36}$ ]] || exit 0
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/jobs/$JOB_ID" || true
